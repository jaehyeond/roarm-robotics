<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif">
<text x="64" y="90" font-size="46" fill="#172438" font-weight="700">From PPO training to a displayed replay</text>
<text x="64" y="148" font-size="28" fill="#172438">Recorded simulation behavior and display processing are separate steps.</text>
<text x="64" y="210" font-size="26" fill="#176c70" font-weight="700">TRAINING AND RECORDING</text>
<rect x="64.0" y="230" width="460.6666666666667" height="178" rx="16" fill="#ffffff" stroke="#a8bacb" stroke-width="2"/>
<text x="84.0" y="278" font-size="27" fill="#172438" font-weight="700">Isaac Lab + PPO</text>
<text x="84.0" y="315" font-size="24" fill="#172438">Train a policy</text>
<path d="M 532.6666666666667 319 H 561.6666666666667 M 551.6666666666667 311 L 561.6666666666667 319 L 551.6666666666667 327" fill="none" stroke="#176c70" stroke-width="3"/>
<rect x="569.6666666666667" y="230" width="460.6666666666667" height="178" rx="16" fill="#ffffff" stroke="#a8bacb" stroke-width="2"/>
<text x="589.6666666666667" y="278" font-size="27" fill="#172438" font-weight="700">Simulation rollout</text>
<text x="589.6666666666667" y="315" font-size="24" fill="#172438">Actions + task checks</text>
<path d="M 1038.3333333333335 319 H 1067.3333333333335 M 1057.3333333333335 311 L 1067.3333333333335 319 L 1057.3333333333335 327" fill="none" stroke="#176c70" stroke-width="3"/>
<rect x="1075.3333333333335" y="230" width="460.6666666666667" height="178" rx="16" fill="#ffffff" stroke="#a8bacb" stroke-width="2"/>
<text x="1095.3333333333335" y="278" font-size="27" fill="#172438" font-weight="700">Saved trajectory</text>
<text x="1095.3333333333335" y="315" font-size="24" fill="#172438">Recorded states</text>
<text x="64" y="495" font-size="26" fill="#176c70" font-weight="700">DISPLAY</text>
<rect x="64.0" y="515" width="460.6666666666667" height="178" rx="16" fill="#ffffff" stroke="#a8bacb" stroke-width="2"/>
<text x="84.0" y="563" font-size="27" fill="#172438" font-weight="700">Recorded states</text>
<text x="84.0" y="600" font-size="24" fill="#172438">Replay in Isaac Sim</text>
<path d="M 532.6666666666667 604 H 561.6666666666667 M 551.6666666666667 596 L 561.6666666666667 604 L 551.6666666666667 612" fill="none" stroke="#176c70" stroke-width="3"/>
<rect x="569.6666666666667" y="515" width="460.6666666666667" height="178" rx="16" fill="#ffffff" stroke="#a8bacb" stroke-width="2"/>
<text x="589.6666666666667" y="563" font-size="27" fill="#172438" font-weight="700">Render rotation</text>
<text x="589.6666666666667" y="600" font-size="24" fill="#172438">Adjusted for display</text>
<path d="M 1038.3333333333335 604 H 1067.3333333333335 M 1057.3333333333335 596 L 1067.3333333333335 604 L 1057.3333333333335 612" fill="none" stroke="#176c70" stroke-width="3"/>
<rect x="1075.3333333333335" y="515" width="460.6666666666667" height="178" rx="16" fill="#ffffff" stroke="#a8bacb" stroke-width="2"/>
<text x="1095.3333333333335" y="563" font-size="27" fill="#172438" font-weight="700">Rendered video</text>
<text x="1095.3333333333335" y="600" font-size="24" fill="#172438">Inspect failure behavior</text>
<rect x="64" y="785" width="1472" height="70" rx="12" fill="#e3edf2"/>
<text x="86" y="829" font-size="25" fill="#172438">The render adjustment changes the display; it does not establish a corrected policy.</text>
</g></svg>
