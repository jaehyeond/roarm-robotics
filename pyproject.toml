[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roarm-tools"
version = "0.1.0"
description = "Offline tools for RoArm-M3 demonstration data, camera calibration and simulated replay"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "PyYAML>=6.0,<7",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
table = ["opencv-python-headless>=4.8,<5"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
